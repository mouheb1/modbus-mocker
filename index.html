<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modbus Register Tracker</title>
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
      color: #333;
    }
    #registers {
      margin: 20px auto;
      padding: 10px;
      width: 80%;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    #notifications {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 300px;
      z-index: 1000;
    }
    #notifications div {
      color: white;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.5s, fadeOut 5s 5s forwards;
    }
    #notifications .connect {
      background-color: #4caf50; /* Green for connect */
    }
    #notifications .disconnect {
      background-color: #f44336; /* Red for disconnect */
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateY(-20px);
      }
    }
    #writeForm {
      margin: 20px auto;
      padding: 20px;
      width: 80%;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    #writeForm label {
      margin-right: 10px;
      font-weight: bold;
    }
    #writeForm input {
      margin-right: 10px;
      padding: 5px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #writeForm button {
      padding: 10px 15px;
      font-size: 16px;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #writeForm button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Modbus Register Tracker</h1>
  <div id="registers">
    <h2>Holding Registers</h2>
    <div>No data available yet...</div>
  </div>
  <div id="notifications"></div>

  <div id="writeForm">
    <h2>Write to Holding Registers</h2>
    <form id="writeForm">
      <label for="address">Address:</label>
      <input type="number" id="address" name="address" min="0" max="9" required />
      <label for="value">Value:</label>
      <input type="number" id="value" name="value" min="0" max="65535" required />
      <button type="submit">Write</button>
    </form>
  </div>

  <script>
    // Helper to get ?room= from the URL
    function getRoomFromQuery() {
      const params = new URLSearchParams(window.location.search);
      return params.get('room') || '';
    }

    const roomName = getRoomFromQuery();
    if (!roomName) {
      alert('No room specified. Redirecting to room selection...');
      window.location.href = 'roomSelection.html';
    }

    // Connect to the Socket.IO server, passing the room in the query
    const socket = io('http://' + window.location.hostname + ':5000', {
      query: { room: roomName }
    });

    // Update displayed registers
    function updateRegisters(data) {
      const registersDiv = document.getElementById('registers');
      registersDiv.innerHTML = `
        <h2>Holding Registers - Room: <em>${roomName}</em></h2>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      `;
    }

    // Display a notification
    function displayNotification(message, type) {
      const notificationsDiv = document.getElementById('notifications');
      const notification = document.createElement('div');
      notification.textContent = message;

      if (type === 'connect') {
        notification.classList.add('connect');
      } else if (type === 'disconnect') {
        notification.classList.add('disconnect');
      }
      notificationsDiv.appendChild(notification);

      // Remove notification after 5 seconds
      setTimeout(() => {
        notification.remove();
      }, 5000);
    }

    // Listen for holdingRegisters updates (for our room)
    socket.on('holdingRegistersUpdate', (data) => {
      console.log('Holding registers updated for room:', roomName, data);
      updateRegisters(data);
    });

    // Listen for new device connection notifications
    socket.on('newDeviceConnected', (data) => {
      console.log('New device connected in room:', roomName, data.message);
      displayNotification(`${data.timestamp}: ${data.message}`, 'connect');
    });

    // Listen for device disconnection notifications
    socket.on('deviceDisconnected', (data) => {
      console.log('Device disconnected in room:', roomName, data.message);
      displayNotification(`${data.timestamp}: ${data.message}`, 'disconnect');
    });

    // Handle write form submission
    const writeForm = document.getElementById('writeForm');
    writeForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const address = parseInt(document.getElementById('address').value, 10);
      const value = parseInt(document.getElementById('value').value, 10);

      // Emit the write request with the room info
      socket.emit('write', { address, value, roomName });
    });
  </script>
</body>
</html>
